<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5e6d5"><link rel="manifest" href="manifest.webmanifest"><title>今天也要活著｜第四版</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;background:#f5e6d5;color:#35332e}body.heal{background:#e7f0e8}.app{max-width:480px;margin:auto;min-height:100dvh;padding:28px 22px 35px}header{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:2px;color:#706b62}h1{font-size:31px;margin:30px 0 8px}#date{color:#777;font-size:14px}.tabs{display:flex;background:#ffffff80;border-radius:16px;padding:5px;margin:28px 0 18px;gap:5px}.tabs button{flex:1;border:0;background:transparent;padding:12px 5px;border-radius:12px;font-size:15px;color:#555}.tabs button.active{background:white;box-shadow:0 2px 10px #00000012;font-weight:700}.quote{background:white;min-height:290px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 25px;text-align:center;box-shadow:0 6px 20px #00000007}.symbol{font-size:50px}.quote p{font-size:24px;font-weight:700;line-height:1.7;margin:25px 0}.quote small{color:#9b938a}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}.actions button{flex:1;border:1px solid #d6c8b9;border-radius:14px;padding:13px 8px;background:#ffffffa8;font-size:14px}.actions button:last-child{background:#514d48;color:white;border-color:#514d48}.bottom{display:flex;justify-content:space-around;margin-top:35px}.bottom button{border:0;background:transparent;font-size:14px;color:#716c65;padding:10px}.bottom button.selected{font-weight:800;color:#333}#panel{margin-top:15px}#panel h2{font-size:19px}#panel li{line-height:1.7;margin-bottom:10px}#panel ul{padding-left:22px}.muted{font-size:13px;color:#777}button{cursor:pointer}.calendar-controls{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0}.calendar-controls button,.calendar-grid button,.return-today{border:1px solid #d6c8b9;background:#fff;border-radius:10px;padding:10px}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.calendar-grid button{padding:9px 2px;font-size:13px}.calendar-grid button.active{background:#514d48;color:#fff}.calendar-grid button:disabled{opacity:.25}.calendar-grid .weekday{text-align:center;font-size:12px;color:#777;padding:7px 0}.return-today{margin-top:12px;width:100%}.hint{font-size:12px;color:#777;margin-top:10px}</style></head><body><main class="app"><header><span>TODAY'S WORDS</span><span>☀</span></header><h1>今天也要活著。</h1><div id="date"></div><div class="tabs"><button id="sarcastic" class="active">☁️ 厭世模式</button><button id="healing">🌿 療癒模式</button></div><section id="home"><div class="quote"><div class="symbol" id="symbol">☁️</div><p id="quote"></p><small>— 給今天的自己 —</small></div><div class="actions"><button id="next">↻ 隨機換一句</button><button id="reset">回到當日</button><button id="favorite">♡ 收藏</button><button id="share">分享／複製</button></div></section><section id="panel" hidden></section><nav class="bottom"><button data-view="home" class="selected">⌂ 今日</button><button data-view="calendar">▦ 日曆</button><button data-view="favorites">♡ 收藏</button></nav></main><script src="quotes.js"></script><script>
const pad=n=>String(n).padStart(2,'0');
const dayKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=new Date();today.setHours(12,0,0,0);
let selected=new Date(today),month=new Date(today.getFullYear(),today.getMonth(),1),mode='sarcastic',view='home',randomQuote=null;
let favorites=[];try{favorites=JSON.parse(localStorage.getItem('favorites')||'[]')}catch{}
const items=window.QUOTES||[];
const pool=()=>items.filter(x=>x.mode===mode);
function fixed(){const key=pad(selected.getMonth()+1)+'-'+pad(selected.getDate());const text=window.DAILY_QUOTES?.[key]?.[mode];return {text:text||'這個日期還沒有語錄。'}}
const current=()=>randomQuote||fixed();
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderCalendar(){const first=new Date(month.getFullYear(),month.getMonth(),1),days=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();let html='<h2>選擇日期</h2><div class="calendar-controls"><button id="prev-month">‹ 上個月</button><strong>'+month.getFullYear()+' 年 '+(month.getMonth()+1)+' 月</strong><button id="next-month">下個月 ›</button></div><div class="calendar-grid">';for(const w of ['日','一','二','三','四','五','六'])html+='<span class="weekday">'+w+'</span>';for(let i=0;i<first.getDay();i++)html+='<span></span>';for(let i=1;i<=days;i++){const d=new Date(month.getFullYear(),month.getMonth(),i);html+='<button data-day="'+i+'" class="'+(dayKey(d)===dayKey(selected)?'active':'')+'">'+i+'</button>'}html+='</div><button class="return-today" id="calendar-today">回到今天</button><p class="hint">全年 366 組日期（含 2 月 29 日），每年同月同日顯示相同語錄。</p>';return html}
function render(){document.body.classList.toggle('heal',mode==='healing');for(const m of ['sarcastic','healing'])document.getElementById(m).classList.toggle('active',mode===m);document.getElementById('symbol').textContent=mode==='sarcastic'?'☁️':'🌿';document.getElementById('date').textContent=new Intl.DateTimeFormat('zh-TW',{dateStyle:'full'}).format(selected)+(randomQuote?' · 隨機語錄':' · 每日固定語錄');document.getElementById('quote').textContent=current().text;document.getElementById('favorite').textContent=favorites.includes(current().text)?'♥ 已收藏':'♡ 收藏';document.getElementById('home').hidden=view!=='home';const panel=document.getElementById('panel');panel.hidden=view==='home';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('selected',b.dataset.view===view));if(view==='favorites')panel.innerHTML='<h2>我的收藏</h2>'+(favorites.length?'<ul>'+favorites.map(s=>'<li>'+escapeHtml(s)+'</li>').join('')+'</ul>':'<p class="muted">還沒有收藏的金句。</p>');if(view==='calendar'){panel.innerHTML=renderCalendar();document.getElementById('prev-month').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);render()};document.getElementById('next-month').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);render()};document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selected=new Date(month.getFullYear(),month.getMonth(),Number(b.dataset.day),12);randomQuote=null;view='home';render()});document.getElementById('calendar-today').onclick=resetToday}}
function resetToday(){selected=new Date();selected.setHours(12,0,0,0);month=new Date(selected.getFullYear(),selected.getMonth(),1);randomQuote=null;view='home';render()}
for(const m of ['sarcastic','healing'])document.getElementById(m).onclick=()=>{mode=m;randomQuote=null;render()};
document.getElementById('next').onclick=()=>{const p=pool();if(p.length<2){alert('需要至少兩句語錄才能隨機切換');return}const options=p.filter(x=>x.text!==current().text);randomQuote=options[Math.floor(Math.random()*options.length)];render()};
document.getElementById('reset').onclick=()=>{randomQuote=null;render()};
document.getElementById('favorite').onclick=()=>{const t=current().text;favorites=favorites.includes(t)?favorites.filter(x=>x!==t):[...favorites,t];localStorage.setItem('favorites',JSON.stringify(favorites));render()};
document.getElementById('share').onclick=async()=>{const t=current().text;try{if(navigator.share)await navigator.share({text:t});else if(navigator.clipboard){await navigator.clipboard.writeText(t);alert('已複製金句')}else prompt('請複製金句',t)}catch(e){if(e.name!=='AbortError')prompt('請複製金句',t)}};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
