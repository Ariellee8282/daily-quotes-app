<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5e6d5"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>今天也要活著｜第六版</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;background:var(--bg,#f5e6d5);color:#35332e}body.heal{background:var(--bg,#e7f0e8)}.app{max-width:480px;margin:auto;min-height:100dvh;padding:28px 22px 35px}header{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:2px;color:#706b62}h1{font-size:31px;margin:30px 0 8px}#date{color:#777;font-size:14px}.tabs{display:flex;background:#ffffff80;border-radius:16px;padding:5px;margin:28px 0 18px;gap:5px}.tabs button{flex:1;border:0;background:transparent;padding:12px 5px;border-radius:12px;font-size:15px;color:#555}.tabs button.active{background:white;box-shadow:0 2px 10px #00000012;font-weight:700}.quote{background:white;min-height:290px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 25px;text-align:center;box-shadow:0 6px 20px #00000007}.symbol{font-size:50px}.quote p{font-size:var(--quote-size,24px);font-weight:700;line-height:1.7;margin:25px 0}.quote small{color:#9b938a}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}.actions button{flex:1;border:1px solid #d6c8b9;border-radius:14px;padding:13px 8px;background:#ffffffa8;font-size:14px}.actions button:last-child{background:#514d48;color:white;border-color:#514d48}.bottom{display:flex;justify-content:space-around;margin-top:35px}.bottom button{border:0;background:transparent;font-size:14px;color:#716c65;padding:10px}.bottom button.selected{font-weight:800;color:#333}#panel{margin-top:15px}#panel h2{font-size:19px}#panel li{line-height:1.7;margin-bottom:10px}#panel ul{padding-left:22px}.favorite-list{list-style:none;padding:0!important;display:grid;gap:12px}.favorite-card{background:#ffffffc9;border-radius:16px;padding:15px}.favorite-meta{font-size:12px;color:#756f66;margin-bottom:8px}.favorite-text{font-size:16px;line-height:1.7}.favorite-remove{margin-top:10px;border:1px solid #d6c8b9;background:white;border-radius:9px;padding:7px 12px;color:#514d48}.muted{font-size:13px;color:#777}button{cursor:pointer}.calendar-controls{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0}.calendar-controls button,.calendar-grid button,.return-today{border:1px solid #d6c8b9;background:#fff;border-radius:10px;padding:10px}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.calendar-grid button{padding:9px 2px;font-size:13px}.calendar-grid button.active{background:#514d48;color:#fff}.calendar-grid button:disabled{opacity:.25}.calendar-grid .weekday{text-align:center;font-size:12px;color:#777;padding:7px 0}.return-today{margin-top:12px;width:100%}.hint{font-size:12px;color:#777;margin-top:10px}
header button{border:0;background:#ffffff8a;padding:8px 12px;border-radius:12px;font-size:13px;color:#514d48;letter-spacing:0}.quote{overflow:hidden}.illustration{width:min(100%,235px);aspect-ratio:1;object-fit:cover;border-radius:25px;box-shadow:0 6px 20px #0000000a}.symbol{font-size:24px;margin-top:8px}.quote p{overflow-wrap:anywhere;margin:12px 0 18px}.actions{grid-template-columns:repeat(2,minmax(0,1fr))}.actions #share-image{grid-column:1/-1;background:#514d48;color:#fff}dialog{width:min(92vw,410px);border:0;border-radius:22px;padding:22px;box-shadow:0 20px 70px #0003;color:#35332e}dialog::backdrop{background:#0006}.settings-head{display:flex;align-items:center;justify-content:space-between}.settings-head button{background:none;border:0;font-size:20px}dialog label{display:block;font-weight:650;margin:18px 0 8px}dialog select{width:100%;padding:12px;border:1px solid #cfc4b8;border-radius:12px;background:white;font-size:16px}.settings-done{width:100%;padding:12px;background:#514d48;color:white;border:0;border-radius:12px;margin-top:18px;font-size:16px}@media(max-width:370px){.app{padding:22px 14px}.quote{padding:20px 15px}.actions button{font-size:13px}}
</style></head><body><main class="app"><header><span>TODAY'S WORDS</span><button id="settings-open" aria-label="外觀設定" title="外觀設定">⚙ 外觀</button></header><h1>今天也要活著。</h1><div id="date"></div><div class="tabs"><button id="sarcastic" class="active">☁️ 厭世模式</button><button id="healing">🌿 療癒模式</button></div><section id="home"><div class="quote"><img class="illustration" src="illustration.webp" alt="女孩與貓的溫暖插畫"><div class="symbol" id="symbol">☁️</div><p id="quote"></p><small>— 給今天的自己 —</small></div><div class="actions"><button id="next">↻ 隨機換一句</button><button id="reset">回到當日</button><button id="favorite">♡ 收藏</button><button id="share">分享文字</button><button id="share-image">▧ 分享圖片</button></div></section><section id="panel" hidden></section><dialog id="settings-dialog" aria-labelledby="settings-title"><form method="dialog"><div class="settings-head"><h2 id="settings-title">外觀設定</h2><button aria-label="關閉">✕</button></div><label for="font-size">語錄字體大小</label><select id="font-size"><option value="20">小</option><option value="24">標準</option><option value="29">大</option><option value="34">特大</option></select><label for="theme-color">背景主題</label><select id="theme-color"><option value="auto">隨模式切換</option><option value="cream">奶茶米</option><option value="sage">鼠尾草綠</option><option value="pink">蜜桃粉</option><option value="blue">霧藍</option></select><p class="hint">設定會保存在目前的瀏覽器中。</p><button class="settings-done">完成</button></form></dialog><nav class="bottom"><button data-view="home" class="selected">⌂ 今日</button><button data-view="calendar">▦ 日曆</button><button data-view="favorites">♡ 收藏</button></nav></main><script src="quotes.js"></script><script>
const pad=n=>String(n).padStart(2,'0');
const dayKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=new Date();today.setHours(12,0,0,0);
let selected=new Date(today),month=new Date(today.getFullYear(),today.getMonth(),1),mode='sarcastic',view='home',randomQuote=null;
// 舊版收藏僅存文字，無法回推當時收藏日期；保留並標示日期未記錄。
let favorites=[];
try {
 const saved=JSON.parse(localStorage.getItem('favorites')||'[]');
 if(Array.isArray(saved)) favorites=saved.filter(x=>typeof x==='string'||(x&&typeof x.text==='string')).map(x=>typeof x==='string'?{text:x,quoteDate:null,savedAt:null,mode:null}:x);
} catch {}
const favoriteKey=x=>JSON.stringify([x.text,x.quoteDate,x.mode]);
const favoriteForCurrent=()=>({text:current().text,quoteDate:dayKey(selected),savedAt:dayKey(new Date()),mode});
const isCurrentFavorite=()=>favorites.some(x=>favoriteKey(x)===favoriteKey(favoriteForCurrent()));
const saveFavorites=()=>localStorage.setItem('favorites',JSON.stringify(favorites));
const displayDate=k=>k? k.replace(/^(\d{4})-(\d{2})-(\d{2})$/,(_,y,m,d)=>`${y}年${Number(m)}月${Number(d)}日`):'日期未記錄（舊版收藏）';
function renderFavorites(){return '<h2>我的收藏</h2><p class=\"muted\">顯示語錄所屬日期與實際收藏日期。舊版收藏沒有日期紀錄。</p>'+(favorites.length?'<ul class=\"favorite-list\">'+favorites.map((x,i)=>'<li class=\"favorite-card\"><div class=\"favorite-meta\">📅 語錄日期：'+escapeHtml(displayDate(x.quoteDate))+(x.savedAt?'｜收藏於：'+escapeHtml(displayDate(x.savedAt)):'')+(x.mode?'｜'+(x.mode==='healing'?'🌿 療癒':'☁️ 厭世'):'')+'</div><div class=\"favorite-text\">'+escapeHtml(x.text)+'</div><button class=\"favorite-remove\" data-remove=\"'+i+'\">移除收藏</button></li>').join('')+'</ul>':'<p class=\"muted\">還沒有收藏的金句。</p>')}

const items=window.QUOTES||[];
const pool=()=>items.filter(x=>x.mode===mode);
function fixed(){const key=pad(selected.getMonth()+1)+'-'+pad(selected.getDate());const text=window.DAILY_QUOTES?.[key]?.[mode];return {text:text||'這個日期還沒有語錄。'}}
const current=()=>randomQuote||fixed();
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderCalendar(){const first=new Date(month.getFullYear(),month.getMonth(),1),days=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();let html='<h2>選擇日期</h2><div class="calendar-controls"><button id="prev-month">‹ 上個月</button><strong>'+month.getFullYear()+' 年 '+(month.getMonth()+1)+' 月</strong><button id="next-month">下個月 ›</button></div><div class="calendar-grid">';for(const w of ['日','一','二','三','四','五','六'])html+='<span class="weekday">'+w+'</span>';for(let i=0;i<first.getDay();i++)html+='<span></span>';for(let i=1;i<=days;i++){const d=new Date(month.getFullYear(),month.getMonth(),i);html+='<button data-day="'+i+'" class="'+(dayKey(d)===dayKey(selected)?'active':'')+'">'+i+'</button>'}html+='</div><button class="return-today" id="calendar-today">回到今天</button><p class="hint">全年 366 組日期（含 2 月 29 日），每年同月同日顯示相同語錄。</p>';return html}
function render(){document.body.classList.toggle('heal',mode==='healing');applyAppearance();for(const m of ['sarcastic','healing'])document.getElementById(m).classList.toggle('active',mode===m);document.getElementById('symbol').textContent=mode==='sarcastic'?'☁️':'🌿';document.getElementById('date').textContent=new Intl.DateTimeFormat('zh-TW',{dateStyle:'full'}).format(selected)+(randomQuote?' · 隨機語錄':' · 每日固定語錄');document.getElementById('quote').textContent=current().text;document.getElementById('favorite').textContent=isCurrentFavorite()?'♥ 已收藏':'♡ 收藏';document.getElementById('home').hidden=view!=='home';const panel=document.getElementById('panel');panel.hidden=view==='home';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('selected',b.dataset.view===view));if(view==='favorites'){panel.innerHTML=renderFavorites();panel.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{favorites.splice(Number(b.dataset.remove),1);saveFavorites();render()})}if(view==='calendar'){panel.innerHTML=renderCalendar();document.getElementById('prev-month').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);render()};document.getElementById('next-month').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);render()};document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selected=new Date(month.getFullYear(),month.getMonth(),Number(b.dataset.day),12);randomQuote=null;view='home';render()});document.getElementById('calendar-today').onclick=resetToday}}
function resetToday(){selected=new Date();selected.setHours(12,0,0,0);month=new Date(selected.getFullYear(),selected.getMonth(),1);randomQuote=null;view='home';render()}
for(const m of ['sarcastic','healing'])document.getElementById(m).onclick=()=>{mode=m;randomQuote=null;render()};
document.getElementById('next').onclick=()=>{const p=pool();if(p.length<2){alert('需要至少兩句語錄才能隨機切換');return}const options=p.filter(x=>x.text!==current().text);randomQuote=options[Math.floor(Math.random()*options.length)];render()};
document.getElementById('reset').onclick=()=>{randomQuote=null;render()};
document.getElementById('favorite').onclick=()=>{const entry=favoriteForCurrent();const index=favorites.findIndex(x=>favoriteKey(x)===favoriteKey(entry));if(index>=0)favorites.splice(index,1);else favorites.unshift(entry);saveFavorites();render()};
document.getElementById('share').onclick=async()=>{const t=current().text;try{if(navigator.share)await navigator.share({text:t});else if(navigator.clipboard){await navigator.clipboard.writeText(t);alert('已複製金句')}else prompt('請複製金句',t)}catch(e){if(e.name!=='AbortError')prompt('請複製金句',t)}};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});

// V6: appearance preferences and image sharing. Existing favorites remain untouched.
const settingsDialog=document.getElementById('settings-dialog');
const fontSizeInput=document.getElementById('font-size');
const themeInput=document.getElementById('theme-color');
const themeColors={cream:'#f5e6d5',sage:'#e7f0e8',pink:'#f8e5e5',blue:'#e5eef7'};
const appearanceKey='daily-quote-appearance-v6';
let appearance={font:'24',theme:'auto'};
try{appearance={...appearance,...JSON.parse(localStorage.getItem(appearanceKey)||'{}')}}catch{}
fontSizeInput.value=['20','24','29','34'].includes(appearance.font)?appearance.font:'24';
themeInput.value=Object.keys(themeColors).concat('auto').includes(appearance.theme)?appearance.theme:'auto';
function applyAppearance(){
 const color=appearance.theme==='auto'?(mode==='healing'?themeColors.sage:themeColors.cream):themeColors[appearance.theme];
 document.body.style.setProperty('--bg',color);
 document.body.style.setProperty('--quote-size',appearance.font+'px');
 document.querySelector('meta[name="theme-color"]').setAttribute('content',color);
}
document.getElementById('settings-open').onclick=()=>settingsDialog.showModal();
for(const el of [fontSizeInput,themeInput])el.addEventListener('change',()=>{
 appearance={font:fontSizeInput.value,theme:themeInput.value};
 localStorage.setItem(appearanceKey,JSON.stringify(appearance));
 applyAppearance();
});
function roundedRect(ctx,x,y,w,h,r){
 ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();
}
function wrappedLines(ctx,text,maxWidth){
 const lines=[];let line='';
 for(const char of Array.from(text)){
  if(ctx.measureText(line+char).width>maxWidth&&line){lines.push(line);line=char}else line+=char;
 }
 if(line)lines.push(line);
 return lines;
}
async function createShareImage(){
 const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1920;
 const ctx=canvas.getContext('2d');
 const bg=appearance.theme==='auto'?(mode==='healing'?themeColors.sage:themeColors.cream):themeColors[appearance.theme];
 ctx.fillStyle=bg;ctx.fillRect(0,0,1080,1920);
 ctx.fillStyle='#514d48';ctx.textAlign='center';
 ctx.font='600 35px sans-serif';ctx.fillText("TODAY'S WORDS",540,135);
 ctx.font='bold 70px sans-serif';ctx.fillText('今天也要活著。',540,265);
 ctx.font='36px sans-serif';ctx.fillText(dayKey(selected).replaceAll('-',' / '),540,337);
 ctx.fillStyle='#fffdfb';roundedRect(ctx,75,405,930,1270,55);
 const image=new Image();image.src='./illustration.webp';
 try{await image.decode();ctx.save();ctx.beginPath();ctx.roundRect(200,465,680,680,38);ctx.clip();ctx.drawImage(image,200,465,680,680);ctx.restore()}catch{}
 ctx.fillStyle='#514d48';ctx.font='bold 49px sans-serif';
 const lines=wrappedLines(ctx,current().text,770);
 const lineHeight=79;let y=1255;
 if(lines.length>4){ctx.font='bold 39px sans-serif';}
 const visible=lines.slice(0,5);
 for(const line of visible){ctx.fillText(line,540,y);y+=lineHeight}
 ctx.font='32px sans-serif';ctx.fillText(mode==='healing'?'🌿 療癒模式':'☁ 厭世模式',540,1600);
 ctx.font='30px sans-serif';ctx.fillText('— 給今天的自己 —',540,1775);
 return await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
}
document.getElementById('share-image').onclick=async()=>{
 const btn=document.getElementById('share-image');btn.disabled=true;btn.textContent='圖片製作中…';
 try{
  const blob=await createShareImage();
  if(!blob)throw Error('無法產生圖片');
  const file=new File([blob],'每日語錄-'+dayKey(selected)+'.png',{type:'image/png'});
  if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:'今天也要活著'})}catch(e){if(e.name!=='AbortError')throw e}}
  else{
   const url=URL.createObjectURL(blob);const a=document.createElement('a');
   a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();
   setTimeout(()=>URL.revokeObjectURL(url),10000);
  }
 }catch(e){alert('圖片分享暫時無法使用，請稍後再試。')}
 finally{btn.disabled=false;btn.textContent='▧ 分享圖片'}
};

render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
