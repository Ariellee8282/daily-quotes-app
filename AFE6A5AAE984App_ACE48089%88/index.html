<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5e6d5"><link rel="manifest" href="manifest.webmanifest"><title>今天也要活著</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;background:#f5e6d5;color:#35332e}body.heal{background:#e7f0e8}.app{max-width:480px;margin:auto;min-height:100dvh;padding:28px 22px 35px}header{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:2px;color:#706b62}h1{font-size:31px;margin:30px 0 8px}#date{color:#777;font-size:14px}.tabs{display:flex;background:#ffffff80;border-radius:16px;padding:5px;margin:28px 0 18px;gap:5px}.tabs button{flex:1;border:0;background:transparent;padding:12px 5px;border-radius:12px;font-size:15px;color:#555}.tabs button.active{background:white;box-shadow:0 2px 10px #00000012;font-weight:700}.quote{background:white;min-height:290px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 25px;text-align:center;box-shadow:0 6px 20px #00000007}.symbol{font-size:50px}.quote p{font-size:24px;font-weight:700;line-height:1.7;margin:25px 0}.quote small{color:#9b938a}.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1;border:1px solid #d6c8b9;border-radius:14px;padding:13px 8px;background:#ffffffa8;font-size:14px}.actions button:last-child{background:#514d48;color:white;border-color:#514d48}.bottom{display:flex;justify-content:space-around;margin-top:35px}.bottom button{border:0;background:transparent;font-size:14px;color:#716c65;padding:10px}.bottom button.selected{font-weight:800;color:#333}#panel{margin-top:15px}#panel h2{font-size:19px}#panel li{line-height:1.7;margin-bottom:10px}#panel ul{padding-left:22px}.muted{font-size:13px;color:#777}button{cursor:pointer}</style></head><body><main class="app"><header><span>TODAY'S WORDS</span><span>☀</span></header><h1>今天也要活著。</h1><div id="date"></div><div class="tabs"><button id="sarcastic" class="active">☁️ 厭世模式</button><button id="healing">🌿 療癒模式</button></div><section id="home"><div class="quote"><div class="symbol" id="symbol">☁️</div><p id="quote"></p><small>— 給今天的自己 —</small></div><div class="actions"><button id="next">↻ 換一句</button><button id="favorite">♡ 收藏</button><button id="share">分享／複製</button></div></section><section id="panel" hidden></section><nav class="bottom"><button data-view="home" class="selected">⌂ 今日</button><button data-view="calendar">▦ 日曆</button><button data-view="favorites">♡ 收藏</button></nav></main><script src="quotes.js"></script><script>const today=new Date();const pad=n=>String(n).padStart(2,'0');const key=`${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;document.querySelector('#date').textContent=new Intl.DateTimeFormat('zh-TW',{dateStyle:'full'}).format(today);let mode='sarcastic',offset=0,view='home';let favorites=[];try{favorites=JSON.parse(localStorage.getItem('favorites')||'[]')}catch{}const items=window.QUOTES||[];function pool(){return items.filter(x=>x.mode===mode)}function index(){const p=pool();const seed=Math.floor(today.getTime()/86400000);return p.length?(seed+offset)%p.length:0}function current(){return pool()[index()]||{text:'還沒有這個模式的金句，請先新增資料。',mode}}function render(){document.body.classList.toggle('heal',mode==='healing');for(const m of ['sarcastic','healing'])document.getElementById(m).classList.toggle('active',mode===m);document.getElementById('symbol').textContent=mode==='sarcastic'?'☁️':'🌿';document.getElementById('quote').textContent=current().text;document.getElementById('favorite').textContent=favorites.includes(current().text)?'♥ 已收藏':'♡ 收藏';document.getElementById('home').hidden=view!=='home';const panel=document.getElementById('panel');panel.hidden=view==='home';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('selected',b.dataset.view===view));if(view==='favorites'){panel.innerHTML='<h2>我的收藏</h2>'+(favorites.length?'<ul>'+favorites.map(s=>'<li>'+escapeHtml(s)+'</li>').join('')+'</ul>':'<p class="muted">還沒有收藏的金句。</p>')}if(view==='calendar'){panel.innerHTML='<h2>日曆</h2><p class="muted">第一版提供今天的每日金句。未來可升級成完整月曆與歷史日期瀏覽。</p>'}}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.getElementById('sarcastic').onclick=()=>{mode='sarcastic';offset=0;render()};document.getElementById('healing').onclick=()=>{mode='healing';offset=0;render()};document.getElementById('next').onclick=()=>{offset++;render()};document.getElementById('favorite').onclick=()=>{const s=current().text;favorites=favorites.includes(s)?favorites.filter(x=>x!==s):[...favorites,s];localStorage.setItem('favorites',JSON.stringify(favorites));render()};document.getElementById('share').onclick=async()=>{const text=current().text;try{if(navigator.share)await navigator.share({text});else if(navigator.clipboard){await navigator.clipboard.writeText(text);alert('已複製金句')}else prompt('請複製金句',text)}catch(e){if(e.name!=='AbortError')prompt('請複製金句',text)}};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
